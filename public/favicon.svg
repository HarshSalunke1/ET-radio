<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A291E"/>
      <stop offset="100%" stop-color="#050706"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BCBA7"/>
      <stop offset="100%" stop-color="#7FAE8B"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Capsule Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Football Pentagon Pattern & Soundwaves -->
  <g transform="translate(256, 256)">
    <!-- Central Glowing Pentagram Football Icon -->
    <circle r="140" fill="none" stroke="url(#accentGrad)" stroke-width="12"/>
    <path d="M 0,-70 L 66,-22 L 41,56 L -41,56 L -66,-22 Z" fill="url(#accentGrad)"/>
    <line x1="0" y1="-70" x2="0" y2="-140" stroke="url(#accentGrad)" stroke-width="8"/>
    <line x1="66" y1="-22" x2="133" y2="-43" stroke="url(#accentGrad)" stroke-width="8"/>
    <line x1="41" y1="56" x2="82" y2="113" stroke="url(#accentGrad)" stroke-width="8"/>
    <line x1="-41" y1="56" x2="-82" y2="113" stroke="url(#accentGrad)" stroke-width="8"/>
    <line x1="-66" y1="-22" x2="-133" y2="-43" stroke="url(#accentGrad)" stroke-width="8"/>
  </g>
</svg>
